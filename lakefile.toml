name = "pairs-trading-with-lean"
version = "0.1.0"
license = "Apache-2.0"
defaultTargets = ["PairsTrading"]
testDriver = "tests"
lintDriver = "batteries/runLinter"
lintDriverArgs = ["PairsTrading"]

[leanOptions]
autoImplicit = false
pp.unicode.fun = true
weak.linter.mathlibStandardSet = true
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso.git"
rev = "v4.35.0"

[[lean_lib]]
name = "PairsTrading"

[[lean_lib]]
name = "Book"

[[lean_exe]]
name = "book"
root = "Book.Main"
supportInterpreter = true

[[lean_exe]]
name = "tests"
root = "Tests.Main"
